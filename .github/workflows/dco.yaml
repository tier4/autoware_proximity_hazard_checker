name: DCO
# ref: https://github.com/anchore/syft/pull/2926/files
on:
  pull_request:
jobs:
  dco:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Check DCO
        id: dco_check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip3 install -U dco-check
          dco-check --verbose --exclude-pattern 'pre-commit-ci\[bot\]@users\.noreply\.github\.com'

      - name: Suggest rebase on DCO failure
        if: failure() && steps.dco_check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## DCO Check Failed\n\nPlease sign off your commits. You can do this by rebasing and signing off all commits in your PR:\n\n\`\`\`bash\ngit rebase --signoff HEAD~$(git rev-list --count HEAD ^origin/${{ github.base_ref }})\n\`\`\`\n\nOr sign off each commit individually with:\n\n\`\`\`bash\ngit commit --amend --signoff\n\`\`\``
            })
